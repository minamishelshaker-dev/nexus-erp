name: Nexus ERP Integration Checks

on:
  push:
    branches:
      - integration/stage23-safety-patch
    paths:
      - "stage22-import/backend/**"
      - ".github/workflows/nexus-erp-integration.yml"
  pull_request:
    branches:
      - recovery/stage22-import
    paths:
      - "stage22-import/backend/**"
      - ".github/workflows/nexus-erp-integration.yml"

permissions:
  contents: read

jobs:
  billing-authorization-tests:
    name: Billing authorization regression tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: nexus_password
          POSTGRES_DB: nexus_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_user -d nexus_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: stage22-import/backend
    env:
      DATABASE_URL: postgresql+asyncpg://nexus_user:nexus_password@localhost:5432/nexus_erp_test
      SECRET_KEY: nexus-ci-only-secret-key-not-for-production-123456
      ENVIRONMENT: test
      DEBUG: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stage22-import/backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run billing authorization regression tests
        run: pytest tests/test_billing_authorization.py -q
