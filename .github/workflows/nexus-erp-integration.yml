name: Nexus ERP Integration Checks

on:
  push:
    branches:
      - integration/stage23-safety-patch
    paths:
      - "stage22-import/backend/**"
      - "stage22-import/frontend/**"
      - ".github/workflows/nexus-erp-integration.yml"
  pull_request:
    branches:
      - recovery/stage22-import
    paths:
      - "stage22-import/backend/**"
      - "stage22-import/frontend/**"
      - ".github/workflows/nexus-erp-integration.yml"

permissions:
  contents: read

jobs:
  billing-authorization-tests:
    name: Billing authorization regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage22-import/backend
    env:
      DATABASE_URL: postgresql+asyncpg://nexus_user:nexus_password@127.0.0.1:5432/nexus_erp_test
      SECRET_KEY: nexus-ci-only-secret-key-not-for-production-123456
      ENVIRONMENT: test
      DEBUG: "false"
      PYTHONPATH: ${{ github.workspace }}/stage22-import/backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stage22-import/backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import FastAPI application smoke test
        run: python -c "from app.main import app; assert app.title == 'Nexus ERP'"
      - name: Run billing authorization regression tests
        run: pytest --noconftest tests/test_billing_authorization.py -q

  frontend-build:
    name: Frontend TypeScript and Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage22-import/frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build

  database-migration-smoke:
    name: PostgreSQL migration smoke test and ORM inventory
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: nexus_ci_password
          POSTGRES_DB: nexus_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_user -d nexus_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: stage22-import/backend
    env:
      DATABASE_URL: postgresql+asyncpg://nexus_user:nexus_ci_password@127.0.0.1:5432/nexus_erp_test
      SECRET_KEY: nexus-ci-only-secret-key-not-for-production-123456
      ENVIRONMENT: test
      DEBUG: "false"
      PYTHONPATH: ${{ github.workspace }}/stage22-import/backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stage22-import/backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Diagnose Alembic revision graph
        run: |
          alembic heads --verbose
          alembic history --verbose
      - name: Apply existing migrations to disposable PostgreSQL
        run: alembic upgrade head
      - name: Generate diagnostic-only ORM parity draft (never applied)
        run: |
          ALEMBIC_CREATE_MISSING_TABLES_ONLY=1 alembic revision --autogenerate --rev-id orm_parity_diagnostic --message "Diagnostic missing ORM tables - review only"
          DRAFT="$(find alembic/versions -maxdepth 1 -name '*orm_parity_diagnostic*.py' -print -quit)"
          test -n "$DRAFT"
          echo "DIAGNOSTIC ONLY: this create-table-only draft is printed for review and applied ONLY to disposable CI PostgreSQL."
          cat "$DRAFT"
          alembic upgrade orm_parity_diagnostic
      - name: Report ORM tables missing from the migration result
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import inspect
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.core.database import Base
          import app.models  # noqa: F401

          async def main():
              engine = create_async_engine(__import__("os").environ["DATABASE_URL"])
              async with engine.connect() as connection:
                  existing = await connection.run_sync(
                      lambda sync_connection: set(
                          inspect(sync_connection).get_table_names(schema="public")
                      )
                  )
              expected = set(Base.metadata.tables)
              missing = sorted(expected - existing)
              print(f"ORM tables: {len(expected)}")
              print(f"Public tables after migrations: {len(existing)}")
              print(f"ORM tables still missing: {len(missing)}")
              for table in missing:
                  print(f"MISSING: {table}")
              await engine.dispose()

          asyncio.run(main())
          PY
      - name: Generate additive-only ORM column and index migration (disposable CI only)
        run: |
          ALEMBIC_ADDITIVE_PARITY_ONLY=1 alembic revision --autogenerate --rev-id orm_additive_parity_diagnostic --message "Additive ORM parity draft - review only"
          DRAFT="$(find alembic/versions -maxdepth 1 -name '*orm_additive_parity_diagnostic*.py' -print -quit)"
          test -n "$DRAFT"
          python - "$DRAFT" <<'PY'
          import ast
          import collections
          import pathlib
          import sys

          draft_path = pathlib.Path(sys.argv[1])
          source = draft_path.read_text()
          parsed = ast.parse(source)
          enum_types = {}
          for node in ast.walk(parsed):
              if not isinstance(node, ast.Call) or not isinstance(node.func, ast.Attribute) or node.func.attr != "Enum":
                  continue
              if not isinstance(node.func.value, ast.Name) or node.func.value.id != "sa":
                  continue
              enum_name = next((kw.value.value for kw in node.keywords if kw.arg == "name" and isinstance(kw.value, ast.Constant)), None)
              labels = [arg.value for arg in node.args if isinstance(arg, ast.Constant) and isinstance(arg.value, str)]
              if enum_name and labels:
                  enum_types[enum_name] = labels
          marker = "    # ### commands auto generated by Alembic - please adjust! ###"
          enum_setup = "\n".join(
              "    postgresql.ENUM(" + ", ".join(repr(label) for label in labels) +
              ", name=" + repr(name) + ").create(op.get_bind(), checkfirst=True)"
              for name, labels in sorted(enum_types.items())
          )
          if enum_setup:
              source = source.replace(marker, marker + "\n" + enum_setup, 1)
              draft_path.write_text(source)
          tree = ast.parse(draft_path.read_text())
          upgrade = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "upgrade")
          calls = []
          for node in ast.walk(upgrade):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and isinstance(node.func.value, ast.Name) and node.func.value.id == "op":
                  calls.append((node.func.attr, node))
          counts = collections.Counter(name for name, _ in calls)
          print("ADDITIVE ORM PARITY DRAFT — DISPOSABLE CI ONLY")
          for name, count in sorted(counts.items()):
              print(f"ADDITIVE {name}: {count}")
          forbidden = {"drop_table", "drop_column", "drop_index", "drop_constraint", "alter_column"}
          found = sorted({name for name, _ in calls} & forbidden)
          if found:
              raise SystemExit(f"Unsafe operations in additive-only draft: {found}")
          PY
          alembic upgrade orm_additive_parity_diagnostic
      - name: Export committed Alembic schema SQL for production review
        run: |
          alembic upgrade head --sql > nexus_erp_production_schema.sql
          test -s nexus_erp_production_schema.sql
      - name: Upload production schema SQL artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-erp-production-schema-sql
          path: stage22-import/backend/nexus_erp_production_schema.sql
          retention-days: 1
      - name: Diagnose full ORM column and constraint parity (review only)
        run: |
          alembic revision --autogenerate --rev-id orm_full_parity_diagnostic --message "Full ORM parity diagnostic - review only"
          DRAFT="$(find alembic/versions -maxdepth 1 -name '*orm_full_parity_diagnostic*.py' -print -quit)"
          test -n "$DRAFT"
          python - "$DRAFT" <<'PY'
          import ast
          import collections
          import pathlib
          import sys

          tree = ast.parse(pathlib.Path(sys.argv[1]).read_text())
          for function_name in ("upgrade", "downgrade"):
              function = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == function_name)
              calls = []
              for node in ast.walk(function):
                  if not isinstance(node, ast.Call):
                      continue
                  func = node.func
                  if isinstance(func, ast.Attribute) and isinstance(func.value, ast.Name) and func.value.id == "op":
                      calls.append((func.attr, node))
              counts = collections.Counter(name for name, _ in calls)
              print(f"FULL ORM PARITY {function_name.upper()} — DIAGNOSTIC ONLY")
              for name, count in sorted(counts.items()):
                  print(f"{function_name.upper()} {name}: {count}")
              for name, node in calls:
                  if name in {"create_table", "drop_table", "add_column", "drop_column", "alter_column", "create_foreign_key", "drop_constraint", "create_index", "drop_index", "create_unique_constraint"}:
                      args = []
                      for arg in node.args[:3]:
                          args.append(arg.value if isinstance(arg, ast.Constant) else ast.unparse(arg))
                      print(f"{function_name.upper()} DETAIL {name}: {args}")
          PY

# CI rerun after fixing discovered frontend and accounting schema blockers.
