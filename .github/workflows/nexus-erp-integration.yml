name: Nexus ERP Integration Checks

on:
  push:
    branches:
      - integration/stage23-safety-patch
    paths:
      - "stage22-import/backend/**"
      - ".github/workflows/nexus-erp-integration.yml"
  pull_request:
    branches:
      - recovery/stage22-import
    paths:
      - "stage22-import/backend/**"
      - ".github/workflows/nexus-erp-integration.yml"

permissions:
  contents: read

jobs:
  billing-authorization-tests:
    name: Billing authorization regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage22-import/backend
    env:
      DATABASE_URL: postgresql+asyncpg://nexus_user:nexus_password@127.0.0.1:5432/nexus_erp_test
      SECRET_KEY: nexus-ci-only-secret-key-not-for-production-123456
      ENVIRONMENT: test
      DEBUG: "false"
      PYTHONPATH: ${{ github.workspace }}/stage22-import/backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stage22-import/backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run billing authorization regression tests
        run: pytest tests/test_billing_authorization.py -q

  frontend-build:
    name: Frontend TypeScript and Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage22-import/frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
# CI rerun after fixing discovered frontend and accounting schema blockers.
