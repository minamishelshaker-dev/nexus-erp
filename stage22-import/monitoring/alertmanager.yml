global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@nexus-erp.com'
  smtp_require_tls: true

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'team-email'

receivers:
  - name: 'team-email'
    email_configs:
      - to: 'team@nexus-erp.com'
        send_resolved: true
